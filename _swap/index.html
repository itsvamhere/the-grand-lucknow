    const board = document.getElementById('board');
    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    const sections = [
      ['Copy & Headings (±20% Lock)', MANIFEST.buckets.copy],
      ['Logos & Sticky Nav Assets', MANIFEST.buckets.logos],
      ['Images & Aspect Locks', MANIFEST.buckets.images],
      ['Videos & Canvas Frames', MANIFEST.buckets.videos],
      ['Typography & Color Tokens', MANIFEST.buckets.tokens],
      ['SEO, Canonical & JSON-LD', MANIFEST.buckets.seo]
    ];
    for (const [title, items] of sections) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h2>' + esc(title) + ' (' + items.length + ')</h2>' +
        (items.length === 0 ? '<div class="slot"><span class="key">No items detected</span></div>' :
          items.map(item =>
            '<div class="slot">' +
              '<span class="badge ' + esc(item.status) + '">' + esc(item.status) + '</span> ' +
              '<span class="key">' + esc(item.id || item.path || item.token) + '</span>' +
              '<div class="val">' + esc(item.replacement || item.replacementPath || item.replacementValue || item.original || item.value || '') + '</div>' +
            '</div>'
          ).join(''));
      board.appendChild(card);
    }
  </script>
