<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#0e1201;font-family:'Lay Grotesk Regular',sans-serif">
  <defs>
    <radialGradient id="mapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0ca" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#fff0ca" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fff0ca" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0ca" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c5a880" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="900" fill="#0e1201"/>

  <!-- Grid / Terrain Blocks -->
  <g opacity="0.15" stroke="#fff0ca" stroke-width="0.5">
    <path d="M0 150 H1200 M0 300 H1200 M0 450 H1200 M0 600 H1200 M0 750 H1200"/>
    <path d="M150 0 V900 M300 0 V900 M450 0 V900 M600 0 V900 M750 0 V900 M900 0 V900 M1050 0 V900"/>
  </g>

  <!-- Park / Green Enclaves -->
  <path d="M 120 180 Q 280 120 400 240 T 320 440 T 160 380 Z" fill="#151d0d" opacity="0.8"/>
  <path d="M 720 540 Q 900 480 1060 600 T 980 800 T 800 760 Z" fill="#151d0d" opacity="0.8"/>
  <path d="M 680 160 Q 820 110 940 190 T 900 360 T 730 310 Z" fill="#151d0d" opacity="0.7"/>

  <!-- Gomti River Contour -->
  <path d="M -50 480 C 220 520, 380 340, 620 420 C 850 500, 1020 310, 1250 360" fill="none" stroke="#1d2912" stroke-width="54" stroke-linecap="round"/>
  <path d="M -50 480 C 220 520, 380 340, 620 420 C 850 500, 1020 310, 1250 360" fill="none" stroke="#253518" stroke-width="36" stroke-linecap="round"/>
  <path d="M -50 480 C 220 520, 380 340, 620 420 C 850 500, 1020 310, 1250 360" fill="none" stroke="#324720" stroke-width="12" stroke-linecap="round" opacity="0.6"/>

  <!-- Arterial Roads (Lucknow network) -->
  <g stroke="#263119" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M 100 850 L 500 480 L 1150 150"/>
    <path d="M 50 250 L 600 480 L 1100 820"/>
    <path d="M 350 50 L 520 460 L 680 880"/>
    <path d="M 850 80 L 600 480 L 320 860"/>
  </g>
  <g stroke="#3a4827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M 100 850 L 500 480 L 1150 150"/>
    <path d="M 50 250 L 600 480 L 1100 820"/>
    <path d="M 350 50 L 520 460 L 680 880"/>
    <path d="M 850 80 L 600 480 L 320 860"/>
    <!-- Secondary avenues -->
    <path d="M 200 350 L 800 380 M 350 620 L 980 580 M 500 200 L 900 680"/>
  </g>

  <!-- Location Glow Area -->
  <circle cx="560" cy="460" r="140" fill="url(#mapGlow)"/>
  <circle cx="560" cy="460" r="45" fill="url(#pinPulse)"/>
  <circle cx="560" cy="460" r="22" fill="#fff0ca"/>
  <circle cx="560" cy="460" r="9" fill="#0e1201"/>

  <!-- Location Pin Marker -->
  <g transform="translate(560, 460) translate(-28, -64)" filter="url(#shadow)">
    <path d="M 28 0 C 12.5 0 0 12.5 0 28 C 0 49 28 72 28 72 C 28 72 56 49 56 28 C 56 12.5 43.5 0 28 0 Z" fill="#fff0ca"/>
    <circle cx="28" cy="28" r="11" fill="#0e1201"/>
  </g>

  <!-- Map Card Overlay -->
  <g transform="translate(620, 390)" filter="url(#shadow)">
    <rect width="360" height="140" rx="6" fill="#13190f" stroke="#fff0ca" stroke-opacity="0.25" stroke-width="1.5"/>
    <text x="28" y="44" fill="#fff0ca" font-size="22" font-weight="600" letter-spacing="0.04em">THE GRAND</text>
    <text x="28" y="74" fill="#fff0ca" font-size="14" font-weight="400" opacity="0.8" letter-spacing="0.02em">Gomti Nagar, Lucknow, UP</text>
    <text x="28" y="98" fill="#fff0ca" font-size="13" font-weight="400" opacity="0.6">26.8500° N, 80.9500° E</text>
    <text x="28" y="122" fill="#fff0ca" font-size="13" font-weight="500" opacity="0.95">Premier Luxury Event Estate ↗</text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(80, 80)" opacity="0.7">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#fff0ca" stroke-width="1" stroke-dasharray="2,3"/>
    <path d="M 0 -26 L 6 -6 L 0 0 L -6 -6 Z" fill="#fff0ca"/>
    <path d="M 0 26 L 6 6 L 0 0 L -6 6 Z" fill="#4d5c38"/>
    <text x="0" y="-32" text-anchor="middle" fill="#fff0ca" font-size="12" font-weight="600">N</text>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(48, 836)">
    <rect width="1104" height="40" rx="3" fill="#13190f" fill-opacity="0.9" stroke="#fff0ca" stroke-opacity="0.15" stroke-width="1"/>
    <text x="24" y="25" fill="#fff0ca" font-size="14" opacity="0.8" letter-spacing="0.06em">THE GRAND • LOCATION MAP</text>
    <text x="1080" y="25" text-anchor="end" fill="#fff0ca" font-size="13" opacity="0.7">GOMTI NAGAR • LUCKNOW</text>
  </g>
</svg>